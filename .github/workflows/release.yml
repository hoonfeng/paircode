name: release

# 发布流水线：三平台原生构建 → 上传 GitHub Release 资产。
#
# 为什么要三平台原生构建（不在 Windows 上一键交叉）：
#   GUI 版 pair.exe 用 cgo 链接 wb-ui 引擎（Skia + GLFW + 平台窗口层）：
#     - Linux 需要 X11 / GL 开发头文件与库（xorg-dev、libgl1-mesa-dev）；
#     - macOS 需要 Xcode 的 Objective-C / Cocoa 框架；
#   这些无法从 Windows 交叉获得，因此每个 runner 只构建**本机平台**产物，
#   产物再汇总到同一个 Release。
#
# 触发：
#   - push tag v*（如 v1.6.21）→ 构建并发布；
#   - workflow_dispatch → 手动构建并发布（版本号取 packager.json）。
#
# 依赖仓库：paircode（后端 + 构建器）与 wb-ui（GUI 引擎），检出为兄弟目录，
# 由 paircode/go.work.gui 的 `use ../wb-ui` 纳入同一 workspace。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            target: windows/amd64
          - name: linux
            os: ubuntu-latest
            target: linux/amd64
          - name: darwin
            os: macos-latest
            target: darwin/arm64
    steps:
      - name: Checkout paircode
        uses: actions/checkout@v4
        with:
          repository: hoonfeng/paircode
          path: paircode
          fetch-depth: 0

      - name: Checkout wb-ui (GUI engine)
        uses: actions/checkout@v4
        with:
          repository: hoonfeng/wb-ui
          path: wb-ui

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: paircode/go.sum

      - name: Install Linux GUI build deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorg-dev libgl1-mesa-dev libxkbcommon-dev libgl1-mesa-dri \
            xvfb x11-utils imagemagick \
            fonts-noto-cjk fonts-wqy-zenhei
          # ★ 中文字体是 headless/窗口自检的前提：Ubuntu runner 默认没有 CJK
          # 字体，wb-ui 的 fontmgr 白名单再正确也加载不到文件 → 满屏方块。
          # fonts-noto-cjk 提供 NotoSansCJK-Regular.ttc（含 SC face），
          # fonts-wqy-zenhei 提供文泉驿兜底。装不上不算致命（macOS 自带 PingFang）。
          fc-list :lang=zh | head -5 || true

      - name: Prepare go:embed frontend
        shell: bash
        working-directory: paircode
        run: node scripts/prepare-embed.mjs

      - name: Build packager
        shell: bash
        working-directory: paircode
        # 顶层 env 里不能用 runner 上下文（GitHub 在 job 起动前求值），
        # 因此在 step 内按实际 runner 决定可执行文件后缀，再导出给后续步骤。
        run: |
          EXE=""
          if [ "$RUNNER_OS" = "Windows" ]; then EXE=".exe"; fi
          go build -o "packager$EXE" ./scripts/packager
          echo "PACKAGER=packager$EXE" >> "$GITHUB_ENV"

      # tag 触发的发布：以 tag 名（v1.6.21 → 1.6.21）覆盖 packager.json 的版本，
      # 保证 zip 文件名与 Release tag 一致。--step 指向不存在的步骤，只做版本
      # 改写、不执行任何 pipeline（packager 在 pipeline 之前处理版本号）。
      - name: Apply tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: paircode
        run: ./"$PACKAGER" --version "${GITHUB_REF_NAME#v}" --version-only

      - name: Build GUI binary (cgo, native)
        shell: bash
        working-directory: paircode
        env:
          # goskia 的 #cgo LDFLAGS 里带 -Wl,-rpath,@loader_path（macOS 的运行时库搜索路径），
          # Go 1.26 的 cgo flag 白名单默认拒绝它，报
          # "invalid flag in #cgo LDFLAGS: -Wl,-rpath,@loader_path"。
          # 显式放行（CI 构建机是隔离环境，全放行没有额外风险）。
          CGO_LDFLAGS_ALLOW: ".*"
        run: ./"$PACKAGER" --step build-go-gui

      - name: Stage Skia runtime library
        shell: bash
        working-directory: paircode
        run: ./"$PACKAGER" --step stage-gui-runtime

      # 单文件启动器：把本机 GUI 主程序 + Skia 原生库 + 插件/前端资源嵌入一个可执行文件，
      # 发布包顶层只暴露 PairCode[.exe]。必须排在 build-go-gui 与 stage-gui-runtime 之后
      # （它从 release/ 目录读取这两步的产物），并排在 package 之前（package 找的就是它）。
      - name: Build single-file launcher (stub)
        shell: bash
        working-directory: paircode
        run: ./"$PACKAGER" --step build-stub

      - name: Build server binaries (cross-free, native target)
        shell: bash
        working-directory: paircode
        run: ./"$PACKAGER" --targets "${{ matrix.target }}" --step build-go

      - name: Package release zip
        shell: bash
        working-directory: paircode
        run: ./"$PACKAGER" --targets "${{ matrix.target }}" --step package

      # 非 Windows 平台的自检：真的把 GUI 引擎的 headless 渲染跑起来（加载前端、
      # 推进事件循环、截图+导出渲染文本），证明不是「只编译通过」。
      # 复用 wb-ui/cmd/gouide 的 -headless 能力，连接本平台刚构建出的 pair-server。
      - name: Headless render self-check
        if: runner.os != 'Windows'
        shell: bash
        working-directory: paircode
        env:
          # goskia 的 #cgo LDFLAGS 带 -Wl,-rpath,@loader_path（macOS 运行时库搜索
          # 路径），Go 1.26 的 cgo flag 白名单默认拒绝，与 Build GUI binary 步骤
          # 保持一致显式放行；否则 macOS 上这一 step 的 `go build ./cmd/gouide`
          # 会直接报 invalid flag in #cgo LDFLAGS。
          CGO_LDFLAGS_ALLOW: ".*"
        run: |
          set -euo pipefail
          mkdir -p _temp
          PORT=9199
          SERVER=release/pair-server-linux-amd64
          if [ "$RUNNER_OS" = "macOS" ]; then SERVER=release/pair-server-darwin-arm64; fi
          chmod +x "$SERVER"
          WEB_PORT=$PORT "$SERVER" > _temp/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "http://127.0.0.1:$PORT/"; then break; fi
            sleep 0.5
          done
          ( cd ../wb-ui && CGO_ENABLED=1 GOWORK=off go build -o ../paircode/_temp/gouide ./cmd/gouide )
          # 运行期依赖 libSkiaSharp（goskia 的 cgo 绑定）：Linux 是 rpath=$ORIGIN、
          # macOS 是 rpath=@loader_path，因此把库放到 gouide 同目录即可命中。
          # stage-gui-runtime 已把本平台库放进 release/；缺库时 gouide 会以
          # 127（找不到动态库）退出，所以失败分支打印 ldd/otool 便于定位。
          cp -f release/libSkiaSharp.* _temp/ 2>/dev/null || true
          ls -l _temp/gouide _temp/libSkiaSharp.* 2>/dev/null || true
          if ! ./_temp/gouide -headless -attach -port $PORT -out _temp/headless.png -frames 60 -dump-text > _temp/headless.log 2>&1; then
            echo "headless 运行失败，依赖诊断："
            case "$RUNNER_OS" in
              macOS) otool -L _temp/gouide || true ;;
              *)     ldd _temp/gouide || true ;;
            esac
            ls -l _temp/ || true
            cat _temp/headless.log || true
            exit 1
          fi
          cat _temp/headless.log
          test -s _temp/headless.png
          # ★ 2026-10-19（多平台中文字体防回归）：headless 日志必须出现
          #   [fontmgr] cjk=<族名>，且族名不能是 (none)。旧实现在 Linux/macOS
          #   上白名单只认 Windows 文件名 → 一个 CJK 字体都加载不到 → cjkTF
          #   退化成西文字体 → 截图里中文全是豆腐块，而 CI 依然"成功"。
          #   这一步现在把「字体落点」变成硬断言。
          grep -q "\[fontmgr\] cjk=" _temp/headless.log || {
            echo "::error::headless.log 缺少 [fontmgr] cjk=<族名>（字体初始化/日志回归）"
            exit 1
          }
          CJK_FAMILY=$(grep -o "\[fontmgr\] cjk=[^ ]*" _temp/headless.log | tail -1 | sed 's/.*cjk=//')
          echo "headless CJK font = $CJK_FAMILY"
          case "$CJK_FAMILY" in
            ""|"(none)")
              echo "::error::未命中 CJK 字体（cjk=$CJK_FAMILY），中文会渲染成方块"
              exit 1
              ;;
          esac
          echo "headless self-check OK: $(ls -lh _temp/headless.png | awk '{print $5}')"

      # ★ 2026-10-19：Linux 真窗口自检（Xvfb）。headless 只能证明「引擎能画」，
      # 这一步启动一体化 GUI（release/pair-linux-amd64 —— 与用户双击的同一个
      # 二进制），在虚拟 X11 屏幕上开真窗口并截屏，验证窗口创建 + 页面装配 +
      # 中文渲染。Xvfb 无 GPU，走 Mesa llvmpipe 软渲染；该步失败不阻断发布，
      # 但会打印明确原因（限制如实记录，不用 headless 截图冒充窗口证据）。
      - name: X11 window self-check (xvfb, Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        working-directory: paircode
        run: |
          set -uo pipefail
          mkdir -p _temp
          GUI=release/pair-linux-amd64
          chmod +x "$GUI"
          cp -f release/libSkiaSharp.* _temp/ 2>/dev/null || true
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a -s "-screen 0 1600x1000x24" bash -c '
            set -u
            WEB_PORT=9198 "$1" > _temp/window.log 2>&1 &
            APP_PID=$!
            for i in $(seq 1 40); do
              if curl -sf -o /dev/null http://127.0.0.1:9198/ 2>/dev/null; then break; fi
              sleep 0.5
            done
            sleep 12
            import -window root _temp/window.png 2> _temp/import.err || true
            kill $APP_PID 2>/dev/null || true
            wait $APP_PID 2>/dev/null || true
          ' _ "$GUI" || echo "xvfb 窗口运行失败（见 _temp/window.log）"
          tail -60 _temp/window.log 2>/dev/null || true
          if [ -f _temp/window.png ] && [ -s _temp/window.png ]; then
            echo "window screenshot OK: $(ls -lh _temp/window.png | awk '{print $5}')"
            grep -q "\[fontmgr\] cjk=" _temp/window.log || {
              echo "::error::窗口模式日志缺少 [fontmgr] cjk=<族名>"
              exit 1
            }
          else
            echo "::warning::未能取得 X11 窗口截图（Xvfb/llvmpipe 限制）；headless 截图仍是同一渲染引擎的有效证据"
            cat _temp/import.err 2>/dev/null || true
          fi

      - name: Upload headless self-check
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: headless-${{ matrix.name }}
          path: |
            paircode/_temp/headless.png
            paircode/_temp/headless.log
            paircode/_temp/server.log
            paircode/_temp/window.png
            paircode/_temp/window.log
          if-no-files-found: error

      - name: Show artifacts
        shell: bash
        working-directory: paircode
        run: ls -lh release/*.zip

      # ★ 2026-10-19：web / gui 是两种独立发行版，各自出「平台包」。
      # 旧实现把 GUI 单文件启动器与 pair-server 塞进同一个 zip（两个 exe 重复
      # 约 40MB，且用户分不清该下哪个）；现在 packager 的 dist.editions 分别
      # 产出 PairCode-web-<ver>-<os>.zip 与 PairCode-gui-<ver>-<os>.zip。
      - name: Upload web release zip
        uses: actions/upload-artifact@v4
        with:
          name: release-web-${{ matrix.name }}
          path: paircode/release/PairCode-web-*.zip
          if-no-files-found: error

      - name: Upload gui release zip
        uses: actions/upload-artifact@v4
        with:
          name: release-gui-${{ matrix.name }}
          path: paircode/release/PairCode-gui-*.zip
          if-no-files-found: error

      # 「单 exe」交付形态：Windows 的 PairCode.exe 自身已内嵌 Skia 运行库、
      # 前端与插件资源，可脱离 zip 直接双击运行。这里额外上传裸 exe，
      # 用户从 Release 一次下载即可用，无需解压。
      - name: Upload standalone Windows exe
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: standalone-windows
          path: paircode/release/PairCode.exe
          if-no-files-found: error

  publish:
    name: publish-release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform zips
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Download standalone Windows exe
        uses: actions/download-artifact@v4
        with:
          path: dist
          name: standalone-windows

      - name: List assets
        run: ls -lh dist

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/PairCode.exe
          draft: false
          prerelease: false
          generate_release_notes: true
