name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: write

jobs:
  lint-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # ★ 2026-10-19：与 release.yml 对齐。cmd/companion 用 //go:embed
      # web-ui/dist 嵌入前端，而 dist/ 被 .gitignore 忽略 —— 干净 checkout
      # 里不存在该目录，go vet/build 会直接报
      # `pattern web-ui/dist: no matching files found`（master CI 长期三段红
      # 的根因之一）。这里从入库的 .pair/assets/runtime/web 复制生成。
      - name: Prepare go:embed frontend
        run: node scripts/prepare-embed.mjs

      - name: Go vet
        run: go vet ./...

      - name: Go build (agent only — no GUI)
        run: go build ./cmd/companion

      - name: Check circular dependencies
        run: go run ./scripts/check_cycles.go

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Prepare go:embed frontend
        run: node scripts/prepare-embed.mjs

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          CGO_ENABLED=0 go test -short -count=1 ./cmd/companion/ ./pkg/... ./internal/... 2>&1 | tee ut.log
        env:
          CGO_ENABLED: "0"

      # ★ 2026-10-18：Actions job 日志/artifact 下载都要仓库 token，外部会话排查
      # 失败只能看到「Run unit tests failure」而无任何细节。这里在失败时把完整
      # 测试输出推到 `ci-logs` 分支（只写一个 log 文件），任何有仓库读权限的人
      # 都能直接读到失败用例名。
      - name: Publish failure log to ci-logs branch
        if: failure()
        shell: bash
        run: |
          set -e
          if [ ! -f ut.log ]; then echo "no ut.log"; exit 0; fi
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-logs
          mkdir -p docs/ci-logs
          cp ut.log "docs/ci-logs/${GITHUB_SHA}.log"
          git add -A docs/ci-logs
          git commit -m "ci: unit test failure log for ${GITHUB_SHA}"
          git push -f origin ci-logs

  # 跨平台构建门禁（2026-10 新增）：Linux/macOS 支持不能只靠"代码里写了
  # 平台分支"来保证——必须有 CI 真实构建一次。Windows 上交叉编译发现不了
  # 「某文件只有 _windows.go、Unix 缺实现」这类问题（例如 pty_unix.go 曾长期
  # 是返回错误的桩、screenshot 非 Windows 直接报不支持）。
  cross-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Prepare go:embed frontend
        run: node scripts/prepare-embed.mjs

      - name: Go build (agent — Linux/macOS)
        run: go build ./cmd/companion
        env:
          CGO_ENABLED: "0"

      - name: Go vet (Linux/macOS)
        run: go vet ./cmd/companion/... ./internal/... ./pkg/...

      - name: Unit tests (Linux/macOS)
        # 只跑已确认跨平台的包：pty 的 shell_test.go 是无平台约束的探测测试
        # （conpty_test.go 为 windows-only，Linux/macOS 自动排除）。
        # 全量内部包测试已由 Windows job 覆盖，避免平台假设导致误红。
        run: go test -short -count=1 ./internal/pty/
        env:
          CGO_ENABLED: "0"
