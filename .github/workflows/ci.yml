name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Go vet
        run: go vet ./...

      - name: Go build (agent only — no GUI)
        run: go build ./cmd/companion

      - name: Check circular dependencies
        run: go run ./scripts/check_cycles.go

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run unit tests
        run: go test -short -count=1 ./cmd/companion/agent/... ./pkg/... ./internal/...
        env:
          CGO_ENABLED: "0"
