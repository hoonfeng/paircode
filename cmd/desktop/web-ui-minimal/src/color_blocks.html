<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1e1e1e; font-family: sans-serif; }
  
  /* === 色块测试 - 验证基本颜色渲染 === */
  .row { display: flex; gap: 8px; padding: 12px; }
  
  /* 基础颜色 */
  .red    { width: 80px; height: 80px; background: #ff0000; }
  .green  { width: 80px; height: 80px; background: #00ff00; }
  .blue   { width: 80px; height: 80px; background: #0000ff; }
  .white  { width: 80px; height: 80px; background: #ffffff; }
  .black  { width: 80px; height: 80px; background: #000000; }
  .gray   { width: 80px; height: 80px; background: #888888; }
  .yellow { width: 80px; height: 80px; background: #ffff00; }
  .cyan   { width: 80px; height: 80px; background: #00ffff; }
  
  /* IDE 主题色 */
  .ide-bg     { width: 120px; height: 80px; background: #3b3b3b; }
  .ide-side   { width: 120px; height: 80px; background: #252526; }
  .ide-active { width: 120px; height: 80px; background: #2d2d2d; }
  .ide-blue   { width: 120px; height: 80px; background: #0078d4; }
  .ide-orange { width: 120px; height: 80px; background: #d47700; }
  .ide-green  { width: 120px; height: 80px; background: #1b8a1b; }
  
  .label { color: #cccccc; font-size: 14px; padding: 4px 0; }
  
  /* 布局测试 */
  .container { display: flex; flex-direction: column; padding: 20px; }
  .flex-row { display: flex; flex-direction: row; gap: 10px; margin: 8px 0; }
  .flex-col { display: flex; flex-direction: column; gap: 4px; }
  
  /* 嵌套测试 */
  .parent { display: flex; width: 400px; height: 100px; background: #2d2d2d; padding: 12px; gap: 12px; }
  .child1 { width: 100px; background: #0078d4; }
  .child2 { flex: 1; background: #3b3b3b; }
  .child3 { width: 60px; background: #d47700; }
</style>
</head>
<body>
  <h1 style="color:white;padding:12px;font-size:18px;">Color Block Test</h1>
  
  <div class="label">基础颜色 (Basic Colors):</div>
  <div class="row">
    <div class="red"></div>
    <div class="green"></div>
    <div class="blue"></div>
    <div class="white"></div>
    <div class="black"></div>
    <div class="gray"></div>
    <div class="yellow"></div>
    <div class="cyan"></div>
  </div>
  
  <div class="label">IDE 主题色:</div>
  <div class="row">
    <div class="ide-bg"></div>
    <div class="ide-side"></div>
    <div class="ide-active"></div>
    <div class="ide-blue"></div>
    <div class="ide-orange"></div>
    <div class="ide-green"></div>
  </div>
  
  <div class="label">Flex 布局嵌套测试:</div>
  <div class="parent">
    <div class="child1"></div>
    <div class="child2"></div>
    <div class="child3"></div>
  </div>
</body>
</html>
