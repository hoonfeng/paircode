<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PairCode IDE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #app { width: 100%; height: 100%; overflow: hidden; }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { }

    :root, .theme-dark {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --bg-hover: #1c2333;
      --bg-active: #1f2b3d;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --text-muted: #6e7681;
      --border-color: #30363d;
      --accent: #58a6ff;
      --accent-light: #79c0ff;
      --accent-bg: rgba(88, 166, 255, 0.10);
      --activity-bar-bg: #0d1117;
      --tab-active-bg: #0d1117;
      --tab-inactive-bg: #161b22;
      --sidebar-bg: #161b22;
      --input-bg: #0d1117;
      --scrollbar-thumb: #30363d;
      --scrollbar-thumb-hover: #484f58;
      --status-text: #fff;
      --term-text: #d4d4d4;
      --term-bg: #0d1117;
      --term-prompt: #6a9955;
      --focus-ring: rgba(88, 166, 255, 0.25);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.25);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.35);
      --border-radius: 4px;
      --border-radius-lg: 8px;
      --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
      --font-code: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace;
      --font-editor: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace;
      --font-size-base: 13px;
      --font-size-sm: 12px;
      --font-size-lg: 15px;
    }

    body {
      font-family: var(--font-ui);
      font-size: var(--font-size-base);
      background: var(--bg-primary);
      color: var(--text-primary);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--scrollbar-thumb-hover);
    }
    ::selection {
      background: var(--accent);
      color: #fff;
    }
    input, textarea, select, button {
      font-family: inherit;
    }
  </style>
  <script src="./assets/app-Djlf0nlq.js"></script>
</head>
<body>
  <div id="app"></div>
</body>
</html>
