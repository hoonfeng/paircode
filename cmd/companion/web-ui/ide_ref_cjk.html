<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>
body { margin: 0; background: #fff; }
.row {
  font-family: "Microsoft YaHei", "SimSun", sans-serif;
  font-size: 13px;
  line-height: 15px;
  height: 15px;
  box-sizing: border-box;
  border-top: 1px solid #ff0000; /* 红色标行顶 */
  background: #f0f0f0;
  color: #000;
  padding: 0;
  white-space: nowrap;
}
.row2 {
  font-family: "Microsoft YaHei", "SimSun", sans-serif;
  font-size: 13px;
  line-height: 15px;
  height: 15px;
  border-top: 1px solid #ff0000;
  background: #f0f0f0;
  color: #000;
}
/* 混合行：中文+拉丁 */
.row3 {
  font-family: "Consolas", "Microsoft YaHei", monospace;
  font-size: 13px;
  line-height: 15px;
  height: 15px;
  border-top: 1px solid #ff0000;
  background: #e8e8e8;
  color: #000;
}
/* 16px 行 */
.row16 {
  font-family: "Microsoft YaHei", sans-serif;
  font-size: 16px;
  line-height: 18px;
  height: 18px;
  border-top: 1px solid #ff0000;
  background: #f0f0f0;
  color: #000;
}
</style></head>
<body>
<div class="row">中文测试文字</div>
<div class="row">设置面板内容</div>
<div class="row2">文件浏览器</div>
<div class="row3">终端中文ABC123</div>
<div class="row16">十六号中文</div>
<div class="row16">英文English</div>
</body>
</html>
