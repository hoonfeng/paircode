<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>RANGE-REF</title>
<style>
  :root { --bg: #0d1117; --text: #e6edf3; }
  body { margin: 0; background: #0d1117; font-family: "Segoe UI", sans-serif; }
  .wrap { padding: 60px 80px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
  .row label { width: 120px; font-size: 13px; color: #e6edf3; }
  .row input[type="range"] { flex: 1; }
  .val { width: 30px; text-align: center; font-size: 12px; color: #8b949e; }
</style>
</head>
<body>
<div class="wrap">
  <div class="row"><label>温度</label><input type="range" id="r1" min="0" max="2" step="0.1" value="0.3" /><span class="val" id="v1">0.3</span></div>
  <div class="row"><label>音量</label><input type="range" id="r2" min="0" max="100" step="1" value="42" /><span class="val" id="v2">42</span></div>
</div>
<script>
  function rect(el){ var r = el.getBoundingClientRect();
    return {x:Math.round(r.left), y:Math.round(r.top), w:Math.round(r.width), h:Math.round(r.height)}; }
  var r1 = document.getElementById('r1');
  var r2 = document.getElementById('r2');
  document.title = 'RANGE-REF:' + JSON.stringify({
    r1: rect(r1), r2: rect(r2),
    val1: rect(document.getElementById('v1')),
    val2: rect(document.getElementById('v2')),
    row1: rect(r1.parentElement),
    row2: rect(r2.parentElement),
    cs: {
      r1H: getComputedStyle(r1).height,
      r1W: getComputedStyle(r1).width,
      r1Appearance: getComputedStyle(r1).appearance || getComputedStyle(r1).webkitAppearance,
      r1Color: getComputedStyle(r1).color,
    }
  });
</script>
</body>
</html>
