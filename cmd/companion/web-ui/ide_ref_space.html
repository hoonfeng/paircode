<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { background: #0d1117; margin: 0; padding: 0; }
  .term { position: absolute; left: 4px; top: 4px; width: 800px; height: 160px;
          background: #0d1117; font-family: Consolas, monospace; font-size: 13px;
          line-height: 15px; white-space: pre; padding: 4px; color: #e6edf3; }
</style>
</head>
<body>
<div class="term" id="term"></div>
<script>
  // 模拟 xterm DOM 行（空格独立 span，与 xterm.js 一致）
  var t = document.getElementById('term');
  function row(text) {
    var d = document.createElement('div');
    d.style.height = '15px';
    d.style.whiteSpace = 'pre';
    // 按连续非空格/空格分段（xterm DOM renderer 风格）
    var re = /([^ ]+)|( +)/g, m;
    while ((m = re.exec(text)) !== null) {
      var s = document.createElement('span');
      s.textContent = m[0];
      d.appendChild(s);
    }
    t.appendChild(d);
  }
  row('ABC DEF  GHI   JKL    MNO');
  row('12345678901234567890');
  row('A B C D E F G H I J');
  row('中 文 空 格  测 试');
  // 输出测量数据供 headless 分析
  window.__spanData = (function(){
    var out = [];
    var rows = t.children;
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i].getBoundingClientRect();
      var spans = [];
      for (var j = 0; j < rows[i].children.length; j++) {
        var k = rows[i].children[j];
        var kr = k.getBoundingClientRect();
        spans.push({t: k.textContent, x: Math.round(kr.x), w: Math.round(kr.width*100)/100});
      }
      out.push({y: Math.round(r.y), h: Math.round(r.height), spans: spans});
    }
    return out;
  })();
</script>
</body>
</html>
