<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <title>PairCode IDE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #app { width: 100%; height: 100%; overflow: hidden; }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { }
    /* ─────────────────────────────────────────────────────
       主题 1: 暗色科技风 (Dark Tech)
       ───────────────────────────────────────────────────── */
    :root, .theme-dark {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --bg-hover: #1c2333;
      --bg-active: #1f2b3d;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --text-muted: #6e7681;
      --border-color: #30363d;
      --accent: #58a6ff;
      --accent-light: #79c0ff;
      --accent-bg: rgba(88, 166, 255, 0.10);
      --activity-bar-bg: #0d1117;
      --tab-active-bg: #0d1117;
      --tab-inactive-bg: #161b22;
      --sidebar-bg: #161b22;
      --input-bg: #0d1117;
      --scrollbar-thumb: #6e7681;
      --scrollbar-thumb-hover: #8b949e;
      --status-text: #fff;
      --term-text: #d4d4d4;
      --term-bg: #0d1117;
      --term-prompt: #6a9955;
      --focus-ring: rgba(88, 166, 255, 0.25);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.25);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.35);
      --border-radius: 4px;
      --border-radius-lg: 8px;
      --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
      --font-code: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace;
      --font-editor: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace;
      --font-size-base: 13px;
      --font-size-sm: 12px;
      --font-size-lg: 15px;
    }

    /* ─────────────────────────────────────────────────────
       主题 2: 白色简约风 (White Minimal)
       ───────────────────────────────────────────────────── */
    .theme-light {
      --bg-primary: #ffffff;
      --bg-secondary: #f8f9fa;
      --bg-tertiary: #f0f1f3;
      --bg-hover: #e8eaed;
      --bg-active: #d3e3fd;
      --text-primary: #1a1a2e;
      --text-secondary: #5f6368;
      --text-muted: #9aa0a6;
      --border-color: #dadce0;
      --accent: #1a73e8;
      --accent-light: #4285f4;
      --accent-bg: rgba(26, 115, 232, 0.08);
      --activity-bar-bg: #2c2c2c;
      --tab-active-bg: #ffffff;
      --tab-inactive-bg: #f0f1f3;
      --sidebar-bg: #f8f9fa;
      --input-bg: #ffffff;
      --scrollbar-thumb: #c1c1c1;
      --scrollbar-thumb-hover: #a1a1a1;
      --status-text: #fff;
      --term-text: #1a1a2e;
      --term-bg: #ffffff;
      --term-prompt: #188038;
      --focus-ring: rgba(26, 115, 232, 0.25);
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.08);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.10);
      --border-radius: 4px;
      --border-radius-lg: 6px;
      --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
      --font-code: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace;
      --font-editor: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace;
      --font-size-base: 13px;
      --font-size-sm: 12px;
      --font-size-lg: 15px;
    }

    /* ─────────────────────────────────────────────────────
       主题 3: 暖色温暖风 (Warm Cozy)
       ───────────────────────────────────────────────────── */
    .theme-warm {
      --bg-primary: #faf3e8;
      --bg-secondary: #f5ece0;
      --bg-tertiary: #efe4d4;
      --bg-hover: #e8dbcb;
      --bg-active: #deccb8;
      --text-primary: #3d2c1e;
      --text-secondary: #7a6a5a;
      --text-muted: #a09080;
      --border-color: #d6c8b8;
      --accent: #b87333;
      --accent-light: #d4956a;
      --accent-bg: rgba(184, 115, 51, 0.10);
      --activity-bar-bg: #5c4033;
      --tab-active-bg: #faf3e8;
      --tab-inactive-bg: #efe4d4;
      --sidebar-bg: #f5ece0;
      --input-bg: #fffcf7;
      --scrollbar-thumb: #d6c8b8;
      --scrollbar-thumb-hover: #b8a898;
      --status-text: #fffcf7;
      --term-text: #3d2c1e;
      --term-bg: #faf3e8;
      --term-prompt: #5a7a4a;
      --focus-ring: rgba(184, 115, 51, 0.25);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.10);
      --shadow-md: 0 4px 14px rgba(0,0,0,0.12);
      --border-radius: 6px;
      --border-radius-lg: 10px;
      --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
      --font-code: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace;
      --font-editor: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace;
      --font-size-base: 13px;
      --font-size-sm: 12px;
      --font-size-lg: 15px;
    }

    /* ─────────────────────────────────────────────────────
       主题 4: 暗夜紫 (Night Purple)
       ───────────────────────────────────────────────────── */
    .theme-night {
      --bg-primary: #12101a;
      --bg-secondary: #1a1726;
      --bg-tertiary: #221f30;
      --bg-hover: #252235;
      --bg-active: #2d2940;
      --text-primary: #d8d4e0;
      --text-secondary: #8a86a0;
      --text-muted: #6a6680;
      --border-color: #2d2940;
      --accent: #9b8ec4;
      --accent-light: #b8add4;
      --accent-bg: rgba(155, 142, 196, 0.10);
      --activity-bar-bg: #12101a;
      --tab-active-bg: #12101a;
      --tab-inactive-bg: #1a1726;
      --sidebar-bg: #1a1726;
      --input-bg: #12101a;
      --scrollbar-thumb: #2d2940;
      --scrollbar-thumb-hover: #3d3960;
      --status-text: #fff;
      --term-text: #d8d4e0;
      --term-bg: #12101a;
      --term-prompt: #8ab88a;
      --focus-ring: rgba(155, 142, 196, 0.25);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.30);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.40);
      --border-radius: 4px;
      --border-radius-lg: 8px;
      --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
      --font-code: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace;
      --font-editor: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace;
      --font-size-base: 13px;
      --font-size-sm: 12px;
      --font-size-lg: 15px;
    }

    /* ── 应用全局变量 ── */
    body {
      font-family: var(--font-ui);
      font-size: var(--font-size-base);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--scrollbar-thumb-hover);
    }
    ::selection {
      background: var(--accent);
      color: #fff;
    }

    /* ── select 下拉浮层（host.go 动态创建，须非 scoped 才能匹配）──
       浏览器标准：option 布局/hover/选中/禁用态全部由样式表驱动，
       不用内联 style（内联优先级高于外部规则会阻挡 :hover 切换）。 */
    .select-popup-option {
      display: block;
      height: 24px;
      line-height: 24px;
      padding: 0 8px;
      font-size: 14px;
      color: var(--text-primary);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .select-popup-option:hover {
      background: var(--bg-hover);
    }
    .select-popup-option-selected {
      background: var(--accent-bg);
    }
    .select-popup-option-selected:hover {
      background: var(--bg-active);
    }
    .select-popup-option-disabled {
      color: var(--text-muted);
    }
    .select-popup-option-disabled:hover {
      background: transparent;
    }
    input, textarea, select, button {
      font-family: inherit;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
