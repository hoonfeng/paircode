<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>MODAL REFERENCE COLLECTOR</title>
<script>
// Modal reference collector: loads the real IDE in an iframe, opens the
// settings modal (and the tool-config popover), then serializes the key
// containers' geometry + scroll metrics into document.title for Edge
// --dump-dom. Purpose: compare wb-ui's modal sizing (flex column auto-height
// + scroll) against the real browser.
// ?tab=instructions / ?tab=philosophy 切换到对应 tab 收集（默认 ai）。
(function(){
  var qs = {};
  location.search.replace(/^\?/, '').split('&').forEach(function(p){
    var kv = p.split('='); if (kv[0]) qs[kv[0]] = decodeURIComponent(kv[1] || '');
  });
  var wantedTab = qs.tab || 'ai';
  var TAB_IDX = {ai:0, agent:1, editor:2, terminal:3, appearance:4, instructions:5, philosophy:6};
  function elInfo(el){
    if (!el) return null;
    var r = el.getBoundingClientRect();
    var cs = null;
    try { cs = window.getComputedStyle(el); } catch(e) {}
    var info = {
      cls: typeof el.className === 'string' ? el.className : '',
      x: Math.round(r.left*10)/10, y: Math.round(r.top*10)/10,
      w: Math.round(r.width*10)/10, h: Math.round(r.height*10)/10
    };
    if (cs) {
      info.disp = cs.display;
      info.pos = cs.position;
      info.overflowY = cs.overflowY;
      info.flex = cs.flex;
      info.maxH = cs.maxHeight;
    }
    info.scrollH = el.scrollHeight;
    info.clientH = el.clientHeight;
    info.scrollTop = el.scrollTop;
    return info;
  }
  function collect(){
    try {
      var f = document.getElementById('ideframe');
      var doc = f.contentDocument;
      var out = {
        tab: wantedTab,
        modal: elInfo(doc.querySelector('.modal-content')),
        modalBody: elInfo(doc.querySelector('.modal-body')),
        settingsBody: elInfo(doc.querySelector('.settings-body')),
        settingsTabs: elInfo(doc.querySelector('.settings-tabs')),
        modalFooter: elInfo(doc.querySelector('.modal-footer')),
        tabs: Array.prototype.slice.call(doc.querySelectorAll('.settings-tabs button')).slice(0,5).map(elInfo),
        textareas: Array.prototype.slice.call(doc.querySelectorAll('.inst-textarea')).map(elInfo)
      };
      var pcb = doc.querySelector('.settings-modal .setting-group input[type="checkbox"]');
      out.philCheck = pcb ? pcb.checked : null;
      document.title = 'MODAL:' + JSON.stringify(out);
    } catch(e) {
      document.title = 'MODAL:ERR:' + e.message;
    }
  }
  window.onload = function(){
    var tries = 0;
    var iv = setInterval(function(){
      tries++;
      try {
        var f = document.getElementById('ideframe');
        var doc = f && f.contentDocument;
        var btn = doc && doc.querySelector('.activity-bottom button');
        if (btn) {
          clearInterval(iv);
          btn.dispatchEvent(new doc.defaultView.Event('click', {bubbles:true}));
          // wait for modal to render
          setTimeout(function(){
            var t2 = 0;
            var iv2 = setInterval(function(){
              t2++;
              var m = doc.querySelector('.modal-content');
              if (m && t2 > 8) {
                clearInterval(iv2);
                setTimeout(function(){
                  // 切到目标 tab
                  if (wantedTab !== 'ai' && doc.querySelectorAll('.settings-tabs button').length > TAB_IDX[wantedTab]) {
                    doc.querySelectorAll('.settings-tabs button')[TAB_IDX[wantedTab]].click();
                    if (wantedTab === 'philosophy') {
                      var cb = doc.querySelector('.settings-modal .setting-group input[type="checkbox"]');
                      if (cb) {
                        cb.checked = true;
                        cb.dispatchEvent(new doc.defaultView.Event('change', {bubbles:true}));
                        cb.dispatchEvent(new doc.defaultView.Event('input', {bubbles:true}));
                      }
                    }
                  }
                  setTimeout(collect, 1500);
                }, 800);
              } else if (t2 > 40) {
                clearInterval(iv2);
                setTimeout(function(){
                  if (wantedTab !== 'ai' && doc.querySelectorAll('.settings-tabs button').length > TAB_IDX[wantedTab]) {
                    doc.querySelectorAll('.settings-tabs button')[TAB_IDX[wantedTab]].click();
                    if (wantedTab === 'philosophy') {
                      var cb = doc.querySelector('.settings-modal .setting-group input[type="checkbox"]');
                      if (cb) {
                        cb.checked = true;
                        cb.dispatchEvent(new doc.defaultView.Event('change', {bubbles:true}));
                        cb.dispatchEvent(new doc.defaultView.Event('input', {bubbles:true}));
                      }
                    }
                  }
                  setTimeout(collect, 1000);
                }, 800);
              }
            }, 300);
          }, 600);
        } else if (tries > 100) {
          clearInterval(iv);
          document.title = 'MODAL:ERR:NO_BTN';
        }
      } catch(e) {
        if (tries > 100) { clearInterval(iv); document.title='MODAL:ERR:'+e.message; }
      }
    }, 250);
  };
})();
</script>
</head>
<body style="margin:0">
<iframe id="ideframe" src="./dist/index.html" width="1280" height="800" style="border:none;width:1280px;height:800px"></iframe>
</body>
</html>
