<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script>
window.__m = (function(){
  var c = document.createElement('canvas');
  var ctx = c.getContext('2d');
  var out = {};
  ctx.font = '13px Consolas';
  out.space = ctx.measureText(' ').width;
  out.A = ctx.measureText('A').width;
  out.cjk = ctx.measureText('中').width;
  out.cjk2 = ctx.measureText('中文').width / 2;
  out.spaceCjk = ctx.measureText('中 ').width - ctx.measureText('中').width;
  // 无 canvas 时的 fallback（某些 headless 环境）
  if (out.space === 0) { out.fallback = true; }
  return out;
})();
document.title = JSON.stringify(window.__m);
</script>
</head>
<body>
<span id="r">measure</span>
</body>
</html>
