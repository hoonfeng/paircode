<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>SETMODAL-REF</title>
<style>
  /* 从 SettingsModal.vue / styles 复刻关键样式 */
  :root {
    --bg-primary: #0d1117; --bg-secondary: #161b22;
    --border-color: #30363d; --text-primary: #e6edf3;
    --text-secondary: #8b949e; --input-bg: #0d1117;
    --accent: #58a6ff;
  }
  body { margin: 0; background: #010409; font-family: "Segoe UI", sans-serif; }
  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
  }
  .modal-content {
    background: var(--bg-secondary); border: 1px solid var(--border-color);
    border-radius: 8px; width: 720px; max-width: 720px; max-height: 80vh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .modal-header { display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--border-color); }
  .modal-header h2 { font-size: 16px; color: var(--text-primary); margin: 0; }
  .modal-body { display: flex; gap: 12px; padding: 0 16px; min-height: 0; }
  .settings-tabs { display: flex; flex-direction: column; gap: 2px; padding: 12px 0; flex-shrink: 0; }
  .settings-tabs button { background: none; border: none; color: var(--text-secondary);
    text-align: left; padding: 6px 10px; border-radius: 4px; font-size: 13px; cursor: pointer; }
  .settings-tabs button.active { background: var(--bg-primary); color: var(--text-primary); }
  .settings-body { flex: 1; overflow: auto; padding: 12px 0 12px 4px; }
  .setting-group { margin-bottom: 16px; }
  .group-title { font-size: 13px; font-weight: 600; color: var(--text-secondary);
    margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border-color); }
  .setting-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .setting-row label { width: 120px; font-size: 13px; color: var(--text-primary); flex-shrink: 0; }
  .setting-row input[type="text"], .setting-row input[type="password"],
  .setting-row input[type="number"], .setting-row select {
    flex: 1; background: var(--input-bg); border: 1px solid var(--border-color);
    color: var(--text-primary); padding: 4px 8px; font-size: 13px; outline: none; border-radius: 3px;
  }
  .setting-row input[type="range"] { flex: 1; }
  .range-val { width: 30px; text-align: center; font-size: 12px; color: var(--text-secondary); }
  .setting-hint { font-size: 11px; color: #d29922; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 8px;
    padding: 12px 16px; border-top: 1px solid var(--border-color); }
  .modal-footer button { padding: 6px 16px; border-radius: 4px; font-size: 13px; cursor: pointer; }
  .btn-primary { background: var(--accent); color: #fff; border: none; }
  .btn-cancel { background: transparent; border: 1px solid var(--border-color); color: var(--text-primary); }
</style>
</head>
<body>
<div class="modal-overlay">
  <div class="modal-content" id="mc">
    <div class="modal-header"><h2>设置</h2><button class="modal-close">×</button></div>
    <div class="modal-body">
      <div class="settings-tabs">
        <button class="active">AI</button><button>Agent</button><button>编辑器</button><button>终端</button><button>关于</button>
      </div>
      <div class="settings-body">
        <div class="setting-group">
          <div class="group-title">服务商与模型</div>
          <div class="setting-row"><label>服务商</label><select><option>选择服务商</option><option>OpenAI</option><option>DeepSeek</option></select></div>
          <div class="setting-row"><label>API 地址</label><input type="text" value="https://api.openai.com/v1" /></div>
          <div class="setting-row"><label>API Key</label><input type="password" placeholder="sk-..." /></div>
          <div class="setting-row"><label>主模型</label><select><option>选择模型</option><option>gpt-4o</option></select></div>
          <div class="setting-row"><label>规划模型</label><select><option>选择模型</option><option>gpt-4o</option></select></div>
          <div class="setting-row"><label>审核模型</label><select><option>选择模型</option><option>gpt-4o</option></select></div>
          <div class="setting-row"><label>温度</label><input type="range" min="0" max="2" step="0.1" value="0.2" /><span class="range-val">0.2</span></div>
          <div class="setting-row"><label>最大 Token</label><input type="number" value="16384" /></div>
          <div class="setting-row"><label>上下文 Token</label><input type="number" value="64000" /></div>
          <div class="setting-row"><label>思考模式</label><select><option>禁用</option><option>启用思考</option></select></div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel">取消</button><button class="btn-primary">保存</button>
    </div>
  </div>
</div>
<script>
  function rect(el){ var r = el.getBoundingClientRect();
    return {x:Math.round(r.left), y:Math.round(r.top), w:Math.round(r.width), h:Math.round(r.height)}; }
  document.title = 'SETMODAL-REF:' + JSON.stringify({
    modal: rect(document.getElementById('mc')),
    header: rect(document.querySelector('.modal-header')),
    body: rect(document.querySelector('.modal-body')),
    tabs: rect(document.querySelector('.settings-tabs')),
    settingsBody: rect(document.querySelector('.settings-body')),
    footer: rect(document.querySelector('.modal-footer')),
    footerBtns: Array.prototype.slice.call(document.querySelectorAll('.modal-footer button')).map(rect),
    rows: Array.prototype.slice.call(document.querySelectorAll('.setting-row')).map(rect),
    rowCount: document.querySelectorAll('.setting-row').length,
    bodyScrollH: document.querySelector('.settings-body').scrollHeight,
    bodyClientH: document.querySelector('.settings-body').clientHeight
  });
</script>
</body>
</html>
