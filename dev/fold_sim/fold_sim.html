<!DOCTYPE html>
<html lang="zh-CN" class="theme-dark">
<head>
<meta charset="UTF-8"/>
<title>折叠状态模拟 - agent 输出收缩排查</title>
<style>
/* ============ index.html 的 dark 主题 CSS 变量（原样复制） ============ */
:root, .theme-dark {
  --bg-primary: #0d1117;
  --bg-secondary: #161b22;
  --bg-tertiary: #21262d;
  --bg-hover: #1c2333;
  --bg-active: #1f2b3d;
  --text-primary: #e6edf3;
  --text-secondary: #8b949e;
  --text-muted: #6e7681;
  --border-color: #30363d;
  --accent: #58a6ff;
  --accent-light: #79c0ff;
  --accent-bg: rgba(88, 166, 255, 0.10);
  --activity-bar-bg: #0d1117;
  --tab-active-bg: #0d1117;
  --tab-inactive-bg: #161b22;
  --sidebar-bg: #161b22;
  --input-bg: #0d1117;
  --scrollbar-thumb: #6e7681;
  --scrollbar-thumb-hover: #8b949e;
  --status-text: #fff;
  --term-text: #d4d4d4;
  --term-bg: #0d1117;
  --term-prompt: #6a9955;
  --focus-ring: rgba(88, 166, 255, 0.25);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.25);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.35);
  --border-radius: 4px;
  --border-radius-lg: 8px;
  --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
  --font-code: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace;
  --font-editor: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace;
  --font-size-base: 13px;
  --font-size-sm: 12px;
  --font-size-lg: 15px;
}

/* ============ 全局 ============ */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body, #app { width: 100%; height: 100%; overflow: hidden; }
body { font-family: var(--font-ui); font-size: var(--font-size-base); background: var(--bg-primary); color: var(--text-primary); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); }
.svg-icon { flex-shrink: 0; display: inline-block; vertical-align: middle; }

/* ============ 聊天区布局（复制 ChatView.vue） ============ */
.chat-view { height: 100%; display: flex; flex-direction: column; }
.cv-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px; border-bottom: 1px solid var(--border-color);
  background: var(--bg-secondary); flex-shrink: 0;
}
.cv-header-left { display: flex; align-items: center; gap: 8px; }
.cv-title { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-primary); font-weight: 600; }
.cv-conv-name { font-size: 11px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 300px; }
.cv-messages { flex: 1; overflow-y: auto; padding: 16px; position: relative; }
.msg-list-wrap { display: flex; flex-direction: column; gap: 12px; }
.msg-item { display: flex; gap: 10px; max-width: 85%; }
.msg-user { align-self: flex-end; flex-direction: row-reverse; }
.msg-assistant { align-self: flex-start; }
.msg-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--bg-secondary); display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; color: var(--text-muted);
}
.msg-bubble { padding: 10px 14px; border-radius: 10px; font-size: 13px; line-height: 1.6; word-break: break-word; }
.bubble-user { background: var(--accent); color: #fff; border-bottom-right-radius: 3px; }
.bubble-assistant { background: var(--bg-secondary); border: 1px solid var(--border-color); border-bottom-left-radius: 3px; }
.user-msg-content p { margin: 0; }
.user-msg-placeholder { color: rgba(255,255,255,0.5); font-style: italic; }
.msg-time { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 4px; }

/* ============ 折叠摘要（收缩状态 1：整条消息折叠） ============ */
.folded-summary {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 10px;
  background: rgba(255,255,255,0.03);
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  color: var(--text-muted, #888);
}
.folded-summary:hover { background: rgba(255,255,255,0.06); }
.folded-chevron { font-size: 10px; }
.folded-title { font-weight: 600; }
.folded-desc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ============ 时间线 ============ */
.tl-item { display: flex; gap: 8px; padding: 4px 0; }
.tl-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
.tl-dot-thinking { background: #a78bfa; }
.tl-dot-tool { background: #60a5fa; }
.tl-dot-content { background: #34d399; }
.tl-dot-ask { background: #fbbf24; }
.tl-body { flex: 1; min-width: 0; }

/* 提问用户段（与 RightPanel.vue AskUserCard 视觉对齐） */
.tl-ask-body { font-size: 12px; }
.ask-card {
  border: 1px solid rgba(251,191,36,0.4); border-radius: 8px; padding: 10px 12px;
  background: rgba(251,191,36,0.06); max-width: 100%; min-width: 0;
}
.ask-question { font-size: 13px; color: var(--text-primary); margin-bottom: 8px; white-space: pre-wrap; }
.ask-options { display: flex; flex-direction: column; gap: 6px; }
.ask-option {
  display: flex; align-items: center; gap: 6px; padding: 6px 10px;
  border: 1px solid var(--border-color); border-radius: 6px; cursor: default;
  color: var(--text-secondary); font-size: 12px;
}
.ask-option:hover { background: rgba(251,191,36,0.08); }
.ask-opt-radio { color: #fbbf24; flex-shrink: 0; }
.ask-answered { margin-top: 8px; font-size: 11px; color: #34d399; }

/* 思考段 */
.tl-think-body { font-size: 12px; color: var(--text-muted, #888); border-left: 2px solid rgba(167,139,250,0.3); padding-left: 8px; }
.tl-thinking-text { white-space: pre-wrap; }
.tl-thinking-collapsed { color: var(--text-muted, #666); cursor: pointer; font-size: 12px; }
.tl-think-fold { font-size: 11px; cursor: pointer; color: #888; margin-top: 4px; }

/* ============ 工具调用（收缩状态 3：展开/收起） ============ */
.tl-tc-header {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 10px;
  background: rgba(96,165,250,0.08);
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  min-width: 0; max-width: 100%; overflow: hidden;
}
.tl-tc-header:hover { background: rgba(96,165,250,0.14); }
.tl-tc-chevron { font-size: 10px; color: #60a5fa; flex-shrink: 0; }
.tl-tc-icon { flex-shrink: 0; }
.tl-tc-name { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 1; }
.tl-tc-param { color: var(--text-muted, #888); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex-shrink: 1; }
.tl-tc-summary { color: #34d399; margin-left: auto; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex-shrink: 1; }
.tl-tc-detail {
  background: var(--bg-primary, #1e1e1e);
  border: 1px solid var(--border-color, #333);
  border-radius: 0 0 6px 6px;
  padding: 10px;
}
.tl-tc-section { margin-bottom: 8px; }
.tl-tc-section:last-child { margin-bottom: 0; }
.tl-tc-section-title { font-size: 11px; color: var(--text-muted, #888); margin-bottom: 4px; font-weight: 600; }
.tl-tc-command { font-family: var(--font-code); font-size: 12px; color: #60a5fa; background: rgba(0,0,0,0.3); padding: 6px 8px; border-radius: 4px; }
.tl-tc-output { font-size: 12px; white-space: pre-wrap; margin: 0; color: var(--text-muted, #aaa); max-height: 300px; overflow-y: auto; }
.tl-tc-detail pre { margin: 0; font-size: 12px; white-space: pre-wrap; }
.tl-tc-detail code { font-size: 12px; }

/* 折叠输出按钮 */
.msg-fold-btn {
  display: flex; align-items: center; gap: 4px;
  margin-top: 6px; font-size: 11px;
  color: var(--text-muted, #666); cursor: pointer; padding: 2px 6px;
}
.msg-fold-btn:hover { color: var(--text-primary, #ccc); }

/* ============ 状态面板（排查辅助：显示各收缩状态） ============ */
.status-panel {
  position: fixed; right: 10px; bottom: 10px;
  background: rgba(13,17,23,0.92); border: 1px solid var(--border-color);
  border-radius: 8px; padding: 8px 10px; font-size: 11px;
  color: var(--text-secondary); z-index: 99; max-width: 420px;
}
.sp-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; flex-wrap: wrap; }
.sp-row b { color: var(--text-primary); }
.sp-on { color: #fbbf24; }
.sp-off { color: #34d399; }
.sp-legend { color: var(--text-muted); margin-top: 4px; border-top: 1px solid var(--border-color); padding-top: 4px; }
</style>
</head>
<body>
<div id="app">
  <div class="chat-view">
    <!-- 头部 -->
    <div class="cv-header">
      <div class="cv-header-left">
        <span class="cv-title"><svg-icon name="bot" :size="16"/> 对话</span>
        <span class="cv-conv-name">折叠状态模拟 - agent 输出收缩排查</span>
      </div>
    </div>

    <!-- 消息区 -->
    <div class="cv-messages">
      <div class="msg-list-wrap">
        <template v-for="(combo, ci) in combos" :key="'c' + ci">
          <!-- 用户消息 -->
          <div v-if="combo.user" class="msg-item msg-user">
            <div class="msg-avatar"><svg-icon name="user" :size="16"/></div>
            <div class="msg-bubble bubble-user">
              <div class="user-msg-content">{{ combo.user.content }}</div>
              <div v-if="combo.user._time" class="msg-time">{{ combo.user._time }}</div>
            </div>
          </div>

          <!-- 助手消息 -->
          <div v-if="combo.assistant" class="msg-item msg-assistant">
            <div class="msg-avatar"><svg-icon name="bot" :size="16"/></div>
            <div class="msg-bubble bubble-assistant">
              <!-- 收缩状态 1：整条折叠 → 完成摘要条 -->
              <div v-if="combo.assistant._folded" class="folded-summary" @click="combo.assistant._folded = false">
                <span class="folded-chevron">▸</span>
                <svg-icon name="list" :size="11"/>
                <span class="folded-title">完成摘要</span>
                <span class="folded-desc">{{ msgSummary(combo.assistant) }}</span>
              </div>

              <template v-if="!combo.assistant._folded">
                <template v-for="(seg, si) in combo.assistant.segments" :key="si">
                  <!-- 思考段 -->
                  <div v-if="seg.type === 'thinking'" class="tl-item">
                    <span class="tl-dot tl-dot-thinking"></span>
                    <div class="tl-body tl-think-body">
                      <div v-if="!seg._collapsed" class="tl-thinking-text">{{ seg.content }}</div>
                      <!-- 收缩状态 2：思考段折叠 -->
                      <div v-else class="tl-thinking-collapsed" @click="seg._collapsed = false">
                        <svg-icon name="message-square" :size="12"/> 思考…
                      </div>
                      <div v-if="!seg._collapsed" class="tl-think-fold" @click.stop="seg._collapsed = true" title="折叠思考">▲ 收起</div>
                    </div>
                  </div>
                  <!-- 工具调用 -->
                  <div v-else-if="seg.type === 'tool_call'" class="tl-item">
                    <span class="tl-dot tl-dot-tool"></span>
                    <div class="tl-body tl-tool">
                      <!-- 收缩状态 3：工具调用 收起/展开 -->
                      <div class="tl-tc-header" @click="seg._expanded = !seg._expanded">
                        <span class="tl-tc-chevron">{{ seg._expanded ? '▾' : '▸' }}</span>
                        <svg-icon :name="toolMeta(seg).icon" :size="11" class="tl-tc-icon"/>
                        <span class="tl-tc-name">{{ toolMeta(seg).title }}</span>
                        <span v-if="toolMeta(seg).detail" class="tl-tc-param">{{ toolMeta(seg).detail }}</span>
                        <span v-if="seg.result && !seg._expanded" class="tl-tc-summary">{{ toolResultSummary(seg) }}</span>
                      </div>
                      <div v-if="seg._expanded" class="tl-tc-detail">
                        <template v-if="isTerminalTool(seg)">
                          <div class="tl-tc-section"><div class="tl-tc-section-title">命令</div><div class="tl-tc-command">{{ formatTerminalCommand(seg) }}</div></div>
                          <div v-if="seg.result" class="tl-tc-section"><div class="tl-tc-section-title">输出</div><pre class="tl-tc-output">{{ seg.result }}</pre></div>
                        </template>
                        <template v-else>
                          <div v-if="seg.argsRaw" class="tl-tc-section"><div class="tl-tc-section-title">参数</div><pre><code>{{ seg.argsRaw }}</code></pre></div>
                          <div v-if="seg.result" class="tl-tc-section"><div class="tl-tc-section-title">结果</div><pre><code>{{ seg.result }}</code></pre></div>
                        </template>
                      </div>
                    </div>
                  </div>
                  <!-- 提问用户（与 RightPanel.vue 的 AskUserCard 对齐） -->
                  <div v-else-if="seg.type === 'ask_user'" class="tl-item">
                    <span class="tl-dot tl-dot-ask"></span>
                    <div class="tl-body tl-ask-body">
                      <div class="ask-card">
                        <div class="ask-question">{{ seg.question }}</div>
                        <div v-if="seg.options && seg.options.length" class="ask-options">
                          <div v-for="(opt, oi) in seg.options" :key="oi" class="ask-option">
                            <span class="ask-opt-radio">{{ seg.askType === 'multi' ? '☐' : '○' }}</span>{{ opt }}
                          </div>
                        </div>
                        <div v-if="seg.answered" class="ask-answered">已回答</div>
                      </div>
                    </div>
                  </div>
                  <!-- 正文 -->
                  <div v-else-if="seg.type === 'content'" class="tl-item tl-content-item">
                    <span class="tl-dot tl-dot-content"></span>
                    <div class="tl-body">{{ seg.content }}</div>
                  </div>
                </template>
              </template>

              <!-- 折叠输出按钮 -->
              <div v-if="!combo.assistant._folded && combo.assistant.segments && combo.assistant.segments.length > 0" class="msg-fold-btn" @click="combo.assistant._folded = true">
                <svg-icon name="chevron-up" :size="12"/><span>折叠输出</span>
              </div>
              <div v-if="combo.assistant._time" class="msg-time">{{ combo.assistant._time }}</div>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>

  <!-- 状态面板 -->
  <div class="status-panel">
    <div class="sp-row" v-for="(c, i) in combos" :key="'sp' + i">
      <b>#{{ i + 1 }}</b>
      <span v-if="c.assistant" :class="c.assistant._folded ? 'sp-on' : 'sp-off'">整条:{{ c.assistant._folded ? '折叠' : '展开' }}</span>
      <template v-if="c.assistant && c.assistant.segments">
        <span v-for="(s, si) in c.assistant.segments" :key="'s' + si"
          :class="((s.type === 'thinking' && s._collapsed) || (s.type === 'tool_call' && s._expanded)) ? 'sp-on' : 'sp-off'">
          {{ s.type === 'thinking' ? (s._collapsed ? '思考已折叠' : '思考展开') : (s.type === 'tool_call' ? (s._expanded ? '工具展开' : '工具收起') : '正文') }}
        </span>
      </template>
    </div>
    <div class="sp-legend">黄色=收缩状态 绿色=展开状态 · 点击「完成摘要/思考…/▲收起/工具行/折叠输出」可切换</div>
  </div>
</div>

<script src="./vue.global.prod.js"></script>
<script src="./real_data.js"></script>
<script>
// ============ chat-utils.js 逻辑（复制，保证内容与真实一致） ============
function safeParse(json) {
  if (!json) return {};
  try { return JSON.parse(json); } catch (e) { return {}; }
}
function toolMeta(seg) {
  var name = seg.name || '';
  var args = safeParse(seg.argsRaw);
  if (/^read_file\b/.test(name)) return { icon: 'file-text', title: '读取文件', detail: args.path || '', summary: '已读取' };
  if (/^write_file\b/.test(name)) return { icon: 'file-plus', title: '写入文件', detail: args.path || '', summary: '已写入' };
  if (/^edit_file|multi_edit\b/.test(name)) return { icon: 'edit', title: '编辑文件', detail: args.path || '', summary: '已编辑' };
  if (/^run_command\b/.test(name)) return { icon: 'terminal', title: '执行命令', detail: '$ ' + (args.command || '').slice(0, 60), summary: '已完成' };
  if (/^run_test\b/.test(name)) return { icon: 'check', title: '运行测试', detail: args.package_path || '', summary: '已完成' };
  if (/^search_content|search_files|find_symbol\b/.test(name)) return { icon: 'search', title: '搜索', detail: (args.pattern || args.symbol || '').slice(0, 60), summary: '已搜索' };
  if (/^web_search|web_fetch|web_debug\b/.test(name)) return { icon: 'globe', title: '网络', detail: (args.query || args.url || '').slice(0, 60), summary: '已完成' };
  if (/^git_\b/.test(name)) return { icon: 'source-control', title: 'Git', detail: args.file || '', summary: '已完成' };
  if (/^go_build|go_run|bug_detect|bug_fix\b/.test(name)) return { icon: 'terminal', title: name, detail: args.path || '', summary: '已完成' };
  if (/^screenshot_|image_|web_debug\b/.test(name)) return { icon: 'image', title: name, detail: '', summary: '已完成' };
  if (/^task_create|task_update|update_tasks|finish_task|generate_commit\b/.test(name)) return { icon: 'list', title: name, detail: '', summary: '已完成' };
  return { icon: 'zap', title: name, detail: '', summary: '' };
}
function toolResultSummary(seg) {
  if (!seg.result) return '';
  var r = seg.result;
  if (/^Error:|err\b|failed|失败\b/i.test(r)) {
    var short = r.split('\n')[0] || r;
    return short.slice(0, 80);
  }
  var lines = r.split('\n').filter(function (l) { return l.trim(); });
  if (lines.length === 0) return '';
  return lines[0].slice(0, 80);
}
function isTerminalTool(seg) {
  var name = seg.name || '';
  return /^run_command|run_test|go_build|go_run\b/.test(name);
}
function formatTerminalCommand(seg) {
  if (!seg.argsRaw) return '';
  var args = safeParse(seg.argsRaw);
  return args.command || '';
}
function msgSummary(assistant) {
  if (!assistant) return '';
  if (typeof assistant._summary === 'string') return assistant._summary;
  var content = assistant.content || '';
  if (!content) return '';
  return content.replace(/\n/g, ' ').slice(0, 50);
}

// ============ 图标组件（SvgIcon 精简版：Feather 风格 path） ============
var SvgIcon = {
  props: ['name', 'size'],
  template:
    '<svg class="svg-icon" :width="size" :height="size" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<template v-if="name === \'bot\'"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></template>' +
    '<template v-else-if="name === \'user\'"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></template>' +
    '<template v-else-if="name === \'list\'"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></template>' +
    '<template v-else-if="name === \'message-square\'"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></template>' +
    '<template v-else-if="name === \'chevron-up\'"><polyline points="18 15 12 9 6 15"/></template>' +
    '<template v-else-if="name === \'square\'"><rect x="6" y="6" width="12" height="12" rx="1"/></template>' +
    '<template v-else-if="name === \'plus\'"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></template>' +
    '<template v-else-if="name === \'file-text\'"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></template>' +
    '<template v-else-if="name === \'file-plus\'"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></template>' +
    '<template v-else-if="name === \'edit\'"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></template>' +
